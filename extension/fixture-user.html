<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bangermeter — userscript build harness</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f7f9f9; margin: 0; padding: 20px; }
    article { display: block; background: #fff; border: 1px solid #e1e8ed; border-radius: 12px; padding: 12px 16px; margin: 0 auto 12px; max-width: 560px; }
    [data-testid="tweetText"] { font-size: 15px; margin: 6px 0; }
    div[role="group"] { display: flex; gap: 24px; margin-top: 8px; color: #536471; font-size: 13px; align-items: center; }
    .name { font-weight: 700; }
    time { color: #536471; font-size: 13px; }
    a { color: #1d9bf0; text-decoration: none; }
    .compose { background: #fff; border: 1px solid #e1e8ed; border-radius: 12px; padding: 12px 16px; margin: 0 auto 12px; max-width: 560px; }
    [contenteditable] { min-height: 48px; outline: none; font-size: 17px; }
    .media { background: #e1e8ed; border-radius: 12px; height: 60px; display: flex; align-items: center; justify-content: center; color: #536471; margin-top: 6px; }
  </style>
</head>
<body>
  <h3 style="max-width:560px;margin:0 auto 12px;">Userscript build harness v3 — single-file bangermeter.user.js (styles self-injected)</h3>

  <div class="compose">
    <div>
      <div data-testid="tweetTextarea_0" role="textbox" contenteditable="true"></div>
    </div>
    <div data-testid="toolBar"></div>
  </div>

  <article data-testid="tweet" id="t1">
    <div data-testid="User-Name"><span class="name">Alice</span> <a href="/alice/status/1001"><time datetime="2026-08-02T13:00:00.000Z">2h</time></a></div>
    <div data-testid="tweetText">Just had a nice coffee this morning with an old friend in the city.</div>
    <div role="group" aria-label="5 replies, 5 reposts, 50 likes, 3 bookmarks, 10000 views">
      <button data-testid="reply" aria-label="5 Replies. Reply">💬 5</button>
      <button data-testid="retweet" aria-label="5 reposts. Repost">🔁 5</button>
      <button data-testid="like" aria-label="50 Likes. Like">❤ 50</button>
      <button data-testid="bookmark" aria-label="3 bookmarks. Bookmark">🔖 3</button>
    </div>
  </article>

  <article data-testid="tweet" id="t4">
    <div data-testid="User-Name"><span class="name">Carol</span> <a href="/carol/status/1004"><time datetime="2026-08-02T12:00:00.000Z">3h</time></a></div>
    <div>Replying to <a href="/alice">@alice</a></div>
    <div data-testid="tweetText">Here is the full clip — the last 30 seconds are wild. What would you have done?</div>
    <div data-testid="videoPlayer" class="media">▶ video player</div>
    <div role="group" aria-label="80 replies, 12 reposts, 300 likes, 40 bookmarks, 25000 views">
      <button data-testid="reply" aria-label="80 Replies. Reply">💬 80</button>
      <button data-testid="retweet" aria-label="12 reposts. Repost">🔁 12</button>
      <button data-testid="like" aria-label="300 Likes. Like">❤ 300</button>
      <button data-testid="bookmark" aria-label="40 bookmarks. Bookmark">🔖 40</button>
    </div>
  </article>

  <script src="bangermeter.user.js"></script>
</body>
</html>
