<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --ts-black: #000000;
      --ts-white: #FFFFFF;
      --ts-cream: #F5F0E6;
      --ts-yellow: #FFEB3B;
      --ts-blue: #2196F3;
      --ts-green: #2E7D32;
      --ts-red: #C62828;
      --ts-ink: #555555;
      --ts-font-display: 'Archivo Black', 'Arial Black', Impact, sans-serif;
      --ts-font-body: 'Space Grotesk', Arial, sans-serif;
    }
    body {
      width: 340px;
      margin: 0;
      font-family: var(--ts-font-body);
      font-size: 13px;
      color: var(--ts-black);
      background: var(--ts-cream);
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--ts-black);
      border-bottom: 3px solid var(--ts-black);
    }
    .bolt-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: var(--ts-yellow);
      border: 2px solid var(--ts-black);
      box-shadow: 2px 2px 0 var(--ts-white);
      flex: none;
    }
    .bolt-box svg { width: 16px; height: 16px; }
    h1 {
      font-family: var(--ts-font-display);
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ts-white);
      margin: 0;
    }
    .sub {
      font-size: 11px;
      color: var(--ts-ink);
      line-height: 1.45;
      padding: 10px 14px 0;
    }
    section {
      margin: 10px 14px;
      padding: 12px;
      background: var(--ts-white);
      border: 2px solid var(--ts-black);
      box-shadow: 4px 4px 0 var(--ts-black);
    }
    h2 {
      font-family: var(--ts-font-display);
      font-weight: 400;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 0 8px;
    }
    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 0;
    }
    .setting label { flex: 1; cursor: pointer; }
    input[type="checkbox"] {
      appearance: none;
      width: 22px;
      height: 22px;
      border: 3px solid var(--ts-black);
      background: var(--ts-white);
      cursor: pointer;
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    input[type="checkbox"]:checked { background: var(--ts-black); }
    input[type="checkbox"]:checked::after {
      content: '✓';
      color: var(--ts-yellow);
      font-size: 14px;
      font-weight: 700;
    }
    input[type="checkbox"]:focus-visible {
      outline: 3px solid var(--ts-blue);
      outline-offset: 2px;
    }
    select {
      font-family: var(--ts-font-body);
      font-size: 12px;
      font-weight: 700;
      color: var(--ts-black);
      background: var(--ts-white);
      border: 3px solid var(--ts-black);
      border-radius: 0;
      padding: 3px 6px;
      cursor: pointer;
    }
    select:focus-visible {
      outline: 3px solid var(--ts-blue);
      outline-offset: 2px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    td { padding: 3px 0; border-bottom: 2px solid var(--ts-cream); }
    tr:last-child td { border-bottom: none; }
    td.w {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }
    td.prov { text-align: right; font-size: 10px; color: var(--ts-ink); width: 90px; }
    .neg { color: var(--ts-red); }
    .pos { color: var(--ts-green); }
    .zero { color: #999; }
    td.prov.obs { color: var(--ts-green); }
    td.prov.est { opacity: .65; }
    td.prov.zero { color: #999; }
    .snapshot {
      margin: 0 0 8px; font-size: 10.5px; line-height: 1.45; color: var(--ts-ink); opacity: .85;
    }
    footer {
      padding: 4px 14px 12px;
      font-size: 10.5px;
      color: var(--ts-ink);
      line-height: 1.45;
    }
    .block-btn {
      display: block;
      width: 100%;
      margin-top: 8px;
      font-family: var(--ts-font-body);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--ts-black);
      background: var(--ts-yellow);
      border: 2px solid var(--ts-black);
      border-radius: 0;
      padding: 6px 8px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ts-black);
    }
    .block-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ts-black); }
    .block-btn:focus-visible { outline: 3px solid var(--ts-blue); outline-offset: 2px; }
    .uth-row {
      display: flex;
      gap: 6px;
      align-items: baseline;
      padding: 4px 0;
      border-bottom: 2px solid var(--ts-cream);
      font-size: 11.5px;
    }
    .uth-row:last-child { border-bottom: none; }
    .uth-label { flex: none; font-weight: 700; font-size: 10.5px; }
    .uth-count { flex: none; color: var(--ts-red); font-weight: 700; }
    .uth-effect {
      flex: 1;
      color: var(--ts-ink);
      font-size: 10.5px;
      line-height: 1.35;
    }
    .uth-error { color: var(--ts-red); font-size: 11px; font-weight: 700; margin-top: 6px; }
    .uth-ok { color: var(--ts-green); font-size: 11.5px; margin-top: 6px; }
    .mini-btn {
      float: right;
      font-family: var(--ts-font-body);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--ts-black);
      background: var(--ts-yellow);
      border: 2px solid var(--ts-black);
      border-radius: 0;
      padding: 1px 6px;
      cursor: pointer;
    }
    .mini-btn:focus-visible { outline: 3px solid var(--ts-blue); outline-offset: 2px; }
    .hist-row {
      display: flex;
      gap: 6px;
      align-items: baseline;
      padding: 4px 0;
      border-bottom: 2px solid var(--ts-cream);
      font-size: 11.5px;
    }
    .hist-row:last-child { border-bottom: none; }
    .hist-scores { flex: none; font-weight: 700; font-variant-numeric: tabular-nums; }
    .hist-scores .c { color: var(--ts-blue); }
    .hist-scores .e { color: var(--ts-green); }
    .hist-snippet {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ts-ink);
    }
    .hist-snippet a { color: inherit; text-decoration: none; }
    .hist-snippet a:hover { text-decoration: underline; }
    .hist-when { flex: none; font-size: 10px; color: var(--ts-ink); opacity: .8; }
    .hist-reply {
      flex: none;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      border: 1px solid var(--ts-ink);
      padding: 0 3px;
      color: var(--ts-ink);
    }
  </style>
</head>
<body>
  <header>
    <span class="bolt-box">
      <svg viewBox="0 0 24 24" fill="#000000" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
    </span>
    <h1>Bangermeter</h1>
  </header>
  <div class="sub">Scores posts with X's published For You ranking weights and the real
    scorer arithmetic (xai-org/x-algorithm, Aug 13 2026).</div>

  <section>
    <h2>Settings</h2>
    <div class="setting">
      <label for="showBadges">Score badges on timeline tweets</label>
      <input type="checkbox" id="showBadges">
    </div>
    <div class="setting">
      <label for="scoreDrafts">Live meter in compose box</label>
      <input type="checkbox" id="scoreDrafts">
    </div>
    <div class="setting">
      <label for="assumeOutOfNetwork" title="Apply the ×0.75 out-of-network multiplier as if the viewer does not follow the author">Assume out-of-network view (×0.75)</label>
      <input type="checkbox" id="assumeOutOfNetwork">
    </div>
    <div class="setting">
      <label for="assumeMutualFollow" title="Score as if the viewer mutually follows the author. X pays 20.0 instead of 5.0 for a reply in that case (BidirectionalFollowReplyWeightBoost = 15.0) — but only on original posts, never on replies or reposts.">Assume mutual follow (reply 5.0 → 20.0)</label>
      <input type="checkbox" id="assumeMutualFollow">
    </div>
    <div class="setting">
      <label for="applyVerifiedBoost2023" title="Simulate the 2023-era verified boost (×4 in-network / ×2 out-of-network, archived commit ec83d01dca). No such multiplier exists in the Aug 2026 release — off by default because it floors every verified author near the top of the scale.">2023 verified boost (×4/×2, historical)</label>
      <input type="checkbox" id="applyVerifiedBoost2023">
    </div>
    <div class="setting">
      <label for="keepHistory" title="Log the score each time you open a breakdown panel, so you can compare formats over time. Stored only in this browser (chrome.storage.local, capped at 200 entries) — never synced, never sent anywhere.">Keep local score history</label>
      <input type="checkbox" id="keepHistory">
    </div>
    <div class="setting">
      <label for="theme" title="Panel and draft-meter theme. Auto follows X's own theme (default / dim / lights out).">Panel theme</label>
      <select id="theme">
        <option value="auto">Auto (match X)</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
  </section>

  <section id="historySection" hidden>
    <h2>Recent scores <button id="clearHistory" class="mini-btn" title="Delete the local score history. This cannot be undone.">Clear</button></h2>
    <p class="snapshot">Logged when you open a breakdown panel. Local to this browser only.</p>
    <div id="historyList"></div>
  </section>

  <section>
    <h2>Under the Hood <button id="uthClear" class="mini-btn" hidden>Remove</button></h2>
    <p class="snapshot" id="uthIntro"></p>
    <div id="uthSummary"></div>
    <input type="file" id="uthFile" accept=".json,application/json" hidden>
    <button id="uthImport" class="block-btn">Import report JSON…</button>
  </section>

  <section>
    <h2>Active weight set</h2>
    <p id="weightSnapshot" class="snapshot"></p>
    <table id="weightTable"></table>
  </section>

  <footer id="footerNote"></footer>

  <script src="weights.js"></script>
  <script src="scoring.js"></script>
  <script src="popup.js"></script>
</body>
</html>
