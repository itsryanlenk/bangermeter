<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bangermeter — engine self-test</title>
  <style>
    body { font-family: Consolas, monospace; font-size: 13px; padding: 16px; background: #0f1419; color: #e7e9ea; }
    .pass { color: #00ba7c; }
    .fail { color: #f4212e; font-weight: bold; }
    h1 { font-size: 16px; }
    h2 { font-size: 13px; color: #8b98a5; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .06em; }
    pre { background: #1c2732; padding: 8px; border-radius: 8px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1 id="title">Bangermeter engine self-test</h1>
  <div id="out"></div>
  <script src="weights.js"></script>
  <script src="scoring.js"></script>
  <script>
    var out = document.getElementById("out");
    var passed = 0, failed = 0;
    function section(t) {
      var h = document.createElement("h2"); h.textContent = t; out.appendChild(h);
    }
    function check(name, cond, detail) {
      var div = document.createElement("div");
      div.className = cond ? "pass" : "fail";
      div.textContent = (cond ? "PASS  " : "FAIL  ") + name + (detail ? "  [" + detail + "]" : "");
      out.appendChild(div);
      if (cond) passed++; else failed++;
    }
    function approx(a, b, eps) { return Math.abs(a - b) < (eps || 1e-9); }
    var E = BangermeterEngine;
    var C = BANGERMETER_CONFIG;
    var H = C.heads;
    // Read the version from config rather than typing it into the heading —
    // a hand-written version in prose is a number that drifts every release.
    document.getElementById("title").textContent =
      "Bangermeter engine self-test — v" + C.version + " (" + C.weightsSnapshot.split(" — ")[0] + " weights)";

    // ================================================================
    // WEIGHT LAYER — verbatim against xai-org/x-algorithm
    // home-mixer/params/param.rs (sync 2026-08-12T04:09:22Z)
    // Every value below was transcribed from the published file. If any
    // of these fail, the tool is lying about X's algorithm.
    // ================================================================
    section("Weight layer — verbatim param.rs");

    var PARAM_RS = {
      favorite: 0.5, reply: 5.0, retweet: 1.0, photo_expand: 0.05, video_open: 0.05,
      click: 0.4, open_link: 0.2, profile_click: 0.0, vqv: 0.05, share: 2.0,
      share_via_dm: 5.0, share_via_copy_link: 20.0, dwell: 0.0, quote: 5.0,
      quoted_click: 0.05, quoted_vqv: 0.0, follow_author: 4.0, post_unexplored: 0.02,
      cont_dwell_time: 0.004, cont_click_dwell_time: 0.0,
      cont_active_secs_5m_residual_norm: 0.0,
      not_interested: -43.2, block_author: -31.2, mute_author: -58.8,
      report: -234.0, not_dwelled: -0.02
    };
    Object.keys(PARAM_RS).forEach(function (k) {
      check("param.rs " + k + " = " + PARAM_RS[k],
        H[k] && H[k].weight === PARAM_RS[k], H[k] ? H[k].weight : "MISSING HEAD");
    });
    check("bidirectional follow reply boost = 15.0",
      C.bidirectionalFollowReplyBoost === 15.0, C.bidirectionalFollowReplyBoost);
    check("bidirectional follow dwell boost = 0.0",
      C.bidirectionalFollowDwellBoost === 0.0, C.bidirectionalFollowDwellBoost);
    check("every head carries its feature-switch param name",
      Object.keys(H).every(function (k) { return typeof H[k].param === "string" && H[k].param.indexOf("rust_home_mixer_") === 0; }));
    check("every head is provenance 2026-published",
      Object.keys(H).every(function (k) { return H[k].provenance === "2026-published"; }));
    check("no bookmark head exists in the 2026 roster", H.bookmark === undefined);

    // ── Facts X published on Aug 14 2026 ──────────────────────────────
    // The weights themselves did not move; these are the clarifications
    // that came with them, and the tool must carry them.
    var SF = C.sourcedFacts;
    check("report/like baseline-probability ratio is on record",
      SF.reportBaselineRatio && SF.reportBaselineRatio.value === 1000);
    check("home-timeline-only rule is recorded",
      !!SF.homeTimelineOnly && /no ranking impact/i.test(SF.homeTimelineOnly.note));
    check("brigading-resistance explanation is recorded",
      !!SF.brigadingResistance && /personalized/i.test(SF.brigadingResistance.note));
    check("Brazil 2026 election filter recorded with its account count",
      SF.brazil2026ElectionFilter && SF.brazil2026ElectionFilter.accounts === 665);
    // The ratio reading X calls incorrect must not reappear as a claim.
    check("the ratio-as-value reading is named as incorrect, not repeated",
      /incorrect/i.test(C.weightsMeaningNote) && /468/.test(C.weightsMeaningNote));
    check("no 2023-era heads survive",
      H.good_click_v1 === undefined && H.good_profile_click === undefined &&
      H.reply_engaged_by_author === undefined && H.negative_feedback_v2 === undefined &&
      H.video_playback_50 === undefined && H.reported === undefined);

    // ── Reply-mode and transparency facts (verified against the repo Aug 25 2026) ──
    check("conversation ranker recorded as UNPUBLISHED",
      SF.conversationRanker && SF.conversationRanker.published === false);
    check("OON reply hard-filter recorded",
      !!SF.oonReplyFilter && /entirely/i.test(SF.oonReplyFilter.note));
    check("reply quality gate: 100K threshold, 0-3 score, label named",
      SF.replyQualityGate.followerThreshold === 100000 && SF.replyQualityGate.scoreMax === 3 &&
      SF.replyQualityGate.zeroScoreLabel === "RiskyHighVizReply" &&
      SF.replyQualityGate.selfRepliesExempt === true);
    // task_write.py applies the label with NO duration argument; the 30-day
    // TTL in enforcement_post.yaml belongs to the llm_slop_post trigger, a
    // different rule. Claiming 30 days here would be a misattribution.
    check("no TTL claimed for the score-0 label application",
      SF.replyQualityGate.labelTtlDays === undefined &&
      /not published/i.test(SF.replyQualityGate.note));
    check("reply rubric marked withheld — inputs listed, no invented direction",
      SF.replyQualityGate.rubricWithheld === true && SF.replyQualityGate.signals.length === 8);
    check("Under the Hood: aggregates only, 18 post + 12 account labels",
      SF.underTheHood.aggregatesOnly === true &&
      SF.underTheHood.postLabelAllowlist.length === 18 &&
      SF.underTheHood.accountLabelAllowlist.length === 12);
    check("July 13 'mutuals' announcement mapped to the EXISTING boost, still 15.0",
      /July 13/.test(H.reply.note) && C.bidirectionalFollowReplyBoost === 15.0);

    // ---- weight sums, exactly as ScoringWeights::new builds them ----
    // ranking_scorer.rs:105-128. cont_* terms and the bidirectional boost are
    // deliberately NOT in positive_sum.
    section("Weight sums (ranking_scorer.rs:105-128)");
    check("positive_sum = 43.32", approx(C.weightSums.positive, 43.32, 1e-9), C.weightSums.positive);
    check("negative_sum = 367.22", approx(C.weightSums.negative, 367.22, 1e-9), C.weightSums.negative);
    check("total_sum = 410.54", approx(C.weightSums.total, 410.54, 1e-9), C.weightSums.total);
    check("cont_dwell_time excluded from positive_sum",
      C.weightSums.positiveMembers.indexOf("cont_dwell_time") === -1);
    check("NEGATIVE_SCORES_OFFSET = 0.001", C.negativeScoresOffset === 0.001);

    // ================================================================
    // offset_score — ranking_scorer.rs:525-533
    // ================================================================
    section("offset_score");
    check("positive branch adds the offset", approx(E.offsetScore(2.0), 2.001), E.offsetScore(2.0));
    // negative branch: (combined + negative_sum) / total_sum * OFFSET
    var negExpect = (-10 + 367.22) / 410.54 * 0.001;
    check("negative branch rescales into (0, offset)", approx(E.offsetScore(-10), negExpect), E.offsetScore(-10));
    check("every negative post sorts below every positive post",
      E.offsetScore(-0.0001) < E.offsetScore(0), E.offsetScore(-0.0001) + " < " + E.offsetScore(0));
    // The deepest possible negative lands at 0 up to f64 error on negative_sum
    // (summing the published weights is not exact). Kept bit-faithful; the
    // display layer guards the sign instead.
    check("deepest negative lands at ~0",
      Math.abs(E.offsetScore(-C.weightSums.negative)) < 1e-15, E.offsetScore(-C.weightSums.negative));

    // A net-negative post must still produce a finite, low score rather than NaN.
    var awful = E.contentScore({ text: "LIKE IF YOU AGREE FOLLOW ME NOW #a #b #c",
      hasExternalLink: true, hashtagCount: 3, isReply: true }, { assumeOutOfNetwork: true });
    check("net-negative post is flagged", awful.netNegative === true, awful.combined);
    check("net-negative post scores finite and low",
      Number.isFinite(awful.score) && awful.score >= 0 && awful.score < 30, awful.score);

    // ================================================================
    // weightedScore — Σ(weight × P) with the pos/neg split
    // ================================================================
    section("weightedScore");
    var r1 = E.weightedScore({ favorite: { weight: 0.5, p: 0.01 } });
    check("fav only: 0.5 x 0.01 + offset", approx(r1.raw, 0.005 + 0.001), r1.raw);
    var r2 = E.weightedScore({ report: { weight: -234.0, p: 0.5 } });
    check("report-dominated post hits the negative branch",
      approx(r2.raw, (-117 + 367.22) / 410.54 * 0.001), r2.raw);
    check("pos/neg parts reported separately",
      approx(r1.pos, 0.005) && r1.neg === 0, r1.pos + "/" + r1.neg);
    var rz = E.weightedScore({ profile_click: { weight: 0.0, p: 0.9 }, dwell: { weight: 0.0, p: 0.9 } });
    check("zeroed heads contribute exactly nothing", approx(rz.combined, 0), rz.combined);

    // ================================================================
    // reply_weight_for — ranking_scorer.rs:180-193
    // Boost applies ONLY to an original post from a mutual-follow author.
    // ================================================================
    section("Bidirectional-follow reply boost");
    check("mutual + original post -> 20.0",
      E.replyWeightFor({ isMutualFollow: true, isReply: false, isRepost: false }) === 20.0,
      E.replyWeightFor({ isMutualFollow: true, isReply: false, isRepost: false }));
    check("not mutual -> 5.0",
      E.replyWeightFor({ isMutualFollow: false, isReply: false, isRepost: false }) === 5.0);
    check("mutual but a reply -> 5.0 (ineligible)",
      E.replyWeightFor({ isMutualFollow: true, isReply: true, isRepost: false }) === 5.0);
    check("mutual but a repost -> 5.0 (ineligible)",
      E.replyWeightFor({ isMutualFollow: true, isReply: false, isRepost: true }) === 5.0);

    // ================================================================
    // oon_applies — ranking_scorer.rs:747-754
    // EnableOonRescoreForInNetworkRepliesRetweets defaults true, so an
    // IN-network reply or repost also takes the 0.75 discount — but ONCE.
    // ================================================================
    section("OON discount");
    check("out-of-network -> applies", E.oonApplies({ inNetwork: false }) === true);
    check("in-network original -> does not apply",
      E.oonApplies({ inNetwork: true, isReply: false, isRepost: false }) === false);
    check("in-network reply -> applies", E.oonApplies({ inNetwork: true, isReply: true }) === true);
    check("in-network repost -> applies", E.oonApplies({ inNetwork: true, isRepost: true }) === true);
    check("unknown network -> does not apply", E.oonApplies({ inNetwork: null }) === false);

    // REGRESSION: pre-0.9.0 applied a "reply x0.75" AND an "OON x0.75"
    // independently, so an out-of-network reply was discounted twice
    // (0.5625). Production multiplies by effective_oon exactly once.
    var oonReply = E.engagementScore(
      { counts: { likes: 200, retweets: 10, replies: 20, views: 50000 }, isReply: true },
      { assumeOutOfNetwork: true });
    var inNetOriginal = E.engagementScore(
      { counts: { likes: 200, retweets: 10, replies: 20, views: 50000 }, isReply: false }, {});
    check("OON discount is applied ONCE, not squared",
      approx(oonReply.raw, inNetOriginal.raw * 0.75, 1e-12),
      oonReply.raw + " vs " + (inNetOriginal.raw * 0.75));

    // Same guarantee on the repost path, which the reply case does not cover.
    var inNetRepost = E.engagementScore(
      { counts: { likes: 200, retweets: 10, replies: 20, views: 50000 }, isRepost: true }, {});
    check("in-network repost takes the discount once",
      approx(inNetRepost.raw, inNetOriginal.raw * 0.75, 1e-12), inNetRepost.raw);
    var oonRepost = E.engagementScore(
      { counts: { likes: 200, retweets: 10, replies: 20, views: 50000 }, isRepost: true },
      { assumeOutOfNetwork: true });
    check("out-of-network repost is still only discounted once",
      approx(oonRepost.raw, inNetOriginal.raw * 0.75, 1e-12), oonRepost.raw);
    // A repost is ineligible for the mutual-follow reply boost even when the
    // viewer has the mutual-follow setting on.
    var mutualRepost = E.engagementScore(
      { counts: { likes: 200, retweets: 10, replies: 20, views: 50000 }, isRepost: true },
      { assumeMutualFollow: true });
    check("mutual-follow boost never reaches a repost",
      approx(mutualRepost.raw, inNetRepost.raw, 1e-12), mutualRepost.raw);

    // ================================================================
    // author diversity — diversity_multiplier(decay, floor, k)
    // (1 - floor) * decay^k + floor
    // ================================================================
    section("Author diversity");
    check("k=0 -> 1.0", approx(E.diversityMultiplier(0), 1.0), E.diversityMultiplier(0));
    check("k=1 -> 0.625", approx(E.diversityMultiplier(1), 0.625), E.diversityMultiplier(1));
    check("k=2 -> 0.4375", approx(E.diversityMultiplier(2), 0.4375), E.diversityMultiplier(2));
    check("decays toward the 0.25 floor", E.diversityMultiplier(30) > 0.25 && E.diversityMultiplier(30) < 0.2501);

    // The pos/neg split is by the sign of the TERM, not the sign of the weight
    // (ranking_scorer.rs:515-521). A negative weight times a negative probability
    // is the only input that distinguishes the two rules.
    var rSign = E.weightedScore({ report: { weight: -234.0, p: -0.1 } });
    check("pos/neg split follows the TERM's sign, not the weight's",
      approx(rSign.pos, 23.4) && rSign.neg === 0, rSign.pos + "/" + rSign.neg);

    // ================================================================
    // Unchanged infrastructure
    // ================================================================
    section("Parsing and decay");
    check("parseCount 1,234", E.parseCount("1,234") === 1234);
    check("parseCount 12.3K", E.parseCount("12.3K") === 12300);
    check("parseCount 4.5M", E.parseCount("4.5M") === 4500000);
    check("parseCount empty", E.parseCount("") === null);
    // Comma-as-decimal. Through v0.8.0 every one of these was wrong by 10x-1000x
    // because commas were stripped before the decimal branch could see them.
    check("parseCount 12,3 K (decimal comma)", E.parseCount("12,3 K") === 12300, E.parseCount("12,3 K"));
    check("parseCount 1,2M (decimal comma)", E.parseCount("1,2M") === 1200000, E.parseCount("1,2M"));
    check("parseCount 1,234,567 (thousands)", E.parseCount("1,234,567") === 1234567, E.parseCount("1,234,567"));
    check("parseCount 1.234,5 (both separators)", E.parseCount("1.234,5") === 1235, E.parseCount("1.234,5"));
    check("parseCount garbage", E.parseCount("abc") === null);

    // ================================================================
    // vqv duration gate — candidates_util.rs::vqv_weight
    // ================================================================
    section("Video quality view gate");
    check("no video -> ineligible", E.vqvEligible({ hasVideo: false }) === false);
    check("GIF -> ineligible", E.vqvEligible({ hasVideo: true, isGif: true }) === false);
    check("3s clip -> ineligible", E.vqvEligible({ hasVideo: true, videoSeconds: 3 }) === false);
    check("exactly 10s -> ineligible (strictly greater)",
      E.vqvEligible({ hasVideo: true, videoSeconds: 10 }) === false);
    check("11s -> eligible", E.vqvEligible({ hasVideo: true, videoSeconds: 11 }) === true);
    check("unknown duration -> eligible", E.vqvEligible({ hasVideo: true }) === true);
    var gifPost = E.contentScore({ text: "look at this", hasVideo: true, isGif: true }, {});
    var longVid = E.contentScore({ text: "look at this", hasVideo: true, videoSeconds: 40 }, {});
    check("GIF scores below a qualifying video", gifPost.score < longVid.score,
      gifPost.score + " vs " + longVid.score);

    // ================================================================
    // Input robustness — the DOM layer should never send these, but a
    // NaN or a string count must not silently become a 100.
    // ================================================================
    section("Input robustness");
    check("strict mutual-follow flag: \"true\" is not true",
      E.replyWeightFor({ isMutualFollow: "true" }) === 5.0);
    check("strict mutual-follow flag: 1 is not true",
      E.replyWeightFor({ isMutualFollow: 1 }) === 5.0);
    var strCount = E.engagementScore({ counts: { likes: "100", retweets: 0, replies: 0, views: 50000 } }, {});
    check("string count does not blow up the score",
      Number.isFinite(strCount.score) && strCount.score <= 60, strCount.score);
    var nanCount = E.engagementScore({ counts: { likes: NaN, retweets: 0, replies: 0, views: 1000 } }, {});
    check("NaN count does not poison raw", Number.isFinite(nanCount.raw), nanCount.raw);
    var strViews = E.engagementScore({ counts: { likes: 10, retweets: 0, replies: 0, views: "5000" } }, {});
    check("string views still scores finite", Number.isFinite(strViews.score), strViews.score);
    check("ageDecay midpoint at halflife", approx(E.ageDecayFactor(360), 0.8), E.ageDecayFactor(360));
    check("ageDecay fresh > old", E.ageDecayFactor(0) > E.ageDecayFactor(2000));

    // ================================================================
    // Engagement (retrospective) score
    // ================================================================
    section("Engagement score");
    // The engagement score's reference is the MEASURED timeline rate, not the
    // content model's prior. A post hitting the measured median must land on 50.
    var base = C.observedRates;
    var views = 100000;
    var eng = E.engagementScore({
      counts: {
        likes: Math.round(base.favorite * views),
        retweets: Math.round(base.retweet * views),
        replies: Math.round(base.reply * views),
        views: views
      },
      isReply: false
    }, {});
    check("measured-median post = 50", eng.score === 50, eng.score);
    check("observedRates are flagged as measured, with a sample on record",
      base.provenance === "measured" && base.n > 0 && typeof base.sample === "string");
    check("observedRates are NOT the content model's priors",
      base.favorite !== C.baselineP.favorite, "both " + base.favorite);

    // reply is still 10x a like (5.0 vs 0.5), down from 27x in the 2023 table
    var replyHeavy = E.engagementScore({ counts: { likes: 100, retweets: 0, replies: 400, views: 100000 } }, {});
    var likeHeavy = E.engagementScore({ counts: { likes: 400, retweets: 0, replies: 100, views: 100000 } }, {});
    check("reply-heavy > like-heavy (reply 5.0 vs fav 0.5)", replyHeavy.score > likeHeavy.score,
      replyHeavy.score + " vs " + likeHeavy.score);

    var noViews = E.engagementScore({ counts: { likes: 5, retweets: 1, replies: 0, views: null } }, {});
    check("no views -> unavailable", noViews.available === false);

    // Shrinkage regressions (the "buh" bug) — must survive the reweight.
    var buh = E.engagementScore({ counts: { likes: 1, retweets: 0, replies: 1, views: 19 } }, {});
    check("tiny sample can't hit 100 (buh case)", buh.score < 90 && buh.score > 50, buh.score);
    check("tiny sample flagged lowSample", buh.lowSample === true && buh.smoothingNote !== null);
    var freshReply = E.engagementScore({ counts: { likes: 0, retweets: 0, replies: 0, views: 6 }, isReply: true }, {});
    check("no-data reply sits near median x0.75", freshReply.score >= 38 && freshReply.score <= 48, freshReply.score);
    // Pre-calibration this asserted ===100, which was itself the bug: against the
    // guessed baseline, 18% of real feed posts pinned at the cap and the top of
    // the scale stopped discriminating. Against measured rates this post is a
    // strong performer, not a maxed-out one.
    var viral = E.engagementScore({ counts: { likes: 2000, retweets: 300, replies: 500, views: 100000 } }, {});
    check("large-sample strong post scores high without pinning",
      viral.score >= 75 && viral.score < 100 && viral.lowSample === false, viral.score);
    // The cap is still reachable — it just takes a genuinely extreme post now.
    var monster = E.engagementScore({ counts: { likes: 40000, retweets: 9000, replies: 12000, views: 200000 } }, {});
    check("the 100 cap is still reachable", monster.score === 100, monster.score);

    // Bookmarks: observable, but there is NO bookmark head in 2026 at all.
    var bm = E.engagementScore({ counts: { likes: 10, retweets: 1, replies: 1, bookmarks: 40, views: 5000 } }, {});
    var noBm = E.engagementScore({ counts: { likes: 10, retweets: 1, replies: 1, views: 5000 } }, {});
    check("bookmarks never touch the score", bm.raw === noBm.raw, bm.raw + " vs " + noBm.raw);
    check("bookmarks surfaced as an unweighted signal", bm.unweightedSignals.length === 1);

    // ================================================================
    // Content (prospective) score
    // ================================================================
    section("Content score");
    var plain = E.contentScore({ text: "Just had a nice coffee this morning with an old friend in the city.", hasVideo: false, hasImage: false, hasExternalLink: false, hashtagCount: 0, isReply: false }, {});
    check("plain tweet content ~50", plain.score >= 45 && plain.score <= 60, plain.score);
    var question = E.contentScore({ text: "What single habit most improved your life this year?", hasVideo: false, hasImage: false, hasExternalLink: false, hashtagCount: 0, isReply: false }, {});
    check("question > plain", question.score > plain.score, question.score + " vs " + plain.score);
    var bareLink = E.contentScore({ text: "example.com/post", hasVideo: false, hasImage: false, hasExternalLink: true, hashtagCount: 0, isReply: false }, {});
    check("bare link < plain", bareLink.score < plain.score, bareLink.score + " vs " + plain.score);
    var bait = E.contentScore({ text: "Like if you agree! Follow me for more!", hasVideo: false, hasImage: false, hasExternalLink: false, hashtagCount: 0, isReply: false }, {});
    check("bait < plain", bait.score < plain.score, bait.score + " vs " + plain.score);
    var tags = E.contentScore({ text: "Great day! #sun #fun #beach #vibes", hasVideo: false, hasImage: false, hasExternalLink: false, hashtagCount: 4, isReply: false }, {});
    check("3+ hashtags < plain", tags.score < plain.score, tags.score + " vs " + plain.score);

    // FLATTENING GUARD (v0.7.1 class of regression): adding ~15 new heads must
    // not compress every post toward one number. A strong post and a weak post
    // have to stay far apart.
    var strong = E.contentScore({ text: "I spent six months rebuilding our deploy pipeline from scratch. Here is every mistake I made, what it cost, and what I would do differently — starting with the one that took down prod for four hours. What would you have done?", hasVideo: false, hasImage: true, hasExternalLink: false, hashtagCount: 0, isReply: false, isThreadStarter: true }, {});
    check("strong post clears 65", strong.score >= 65, strong.score);
    check("strong - bait spread >= 25 points", strong.score - bait.score >= 25,
      strong.score + " - " + bait.score + " = " + (strong.score - bait.score));

    // v0.7.1 REGRESSION: the exact user-reported case.
    var userCase = E.engagementScore({ counts: { likes: 0, retweets: 0, replies: 0, views: 58 }, isVerified: true, hasVideo: true }, {});
    check("zero-engagement verified post scores ~median", userCase.score >= 44 && userCase.score <= 52, userCase.score);
    var userContent = E.contentScore({ text: "me", hasVideo: true, isVerified: true }, {});
    check("zero-signal verified content ~median", userContent.score >= 42 && userContent.score <= 58, userContent.score);

    // ================================================================
    // Opt-in / historical factors
    // ================================================================
    section("Opt-in factors");
    var vBase = { text: "Hello world, a normal update today.", hasVideo: false, hasImage: false,
      hasExternalLink: false, hashtagCount: 0, isReply: false };
    var vNo = E.contentScore(vBase, {});
    var vDefault = E.contentScore(Object.assign({}, vBase, { isVerified: true }), {});
    check("verified is a NO-OP by default", vDefault.raw === vNo.raw, vDefault.raw.toFixed(6));
    var vYes = E.contentScore(Object.assign({}, vBase, { isVerified: true }), { applyVerifiedBoost2023: true });
    check("verified x4 on content when opted in", approx(vYes.raw, vNo.raw * 4.0, 1e-12), vYes.raw.toFixed(6));
    var noted = E.contentScore(Object.assign({}, vBase, { hasCommunityNote: true }), {});
    check("community note x0.5 on content", approx(noted.raw, vNo.raw * 0.5, 1e-12), noted.raw.toFixed(6));
    var engPlain = E.engagementScore({ counts: { likes: 100, retweets: 5, replies: 10, views: 50000 } }, {});
    var engNoted = E.engagementScore({ counts: { likes: 100, retweets: 5, replies: 10, views: 50000 }, hasCommunityNote: true }, {});
    check("community note NOT applied to engagement", engNoted.raw === engPlain.raw, engNoted.raw.toFixed(6));

    // Mutual-follow boost end to end: an original post from a mutual scores
    // higher than the same post from a stranger, because reply is 20.0 not 5.0.
    var fromStranger = E.contentScore(Object.assign({}, vBase, { isMutualFollow: false }), {});
    var fromMutual = E.contentScore(Object.assign({}, vBase, { isMutualFollow: true }), {});
    check("mutual-follow original outscores stranger", fromMutual.raw > fromStranger.raw,
      fromMutual.raw.toFixed(6) + " vs " + fromStranger.raw.toFixed(6));

    // ================================================================
    // Locale-aware action-bar parsing — moved out of content.js so it can
    // be tested. The English words are the baseline; other locales join the
    // table only with a sourced string (same rule as the weight layer).
    // ================================================================
    section("Locale-aware action-bar parsing");
    var enLabel = E.parseActionBarLabel("1 reply, 5 reposts, 30 likes, 2 bookmarks, 1034 views");
    check("English label parses all five counts",
      enLabel.replies === 1 && enLabel.retweets === 5 && enLabel.likes === 30 &&
      enLabel.bookmarks === 2 && enLabel.views === 1034, JSON.stringify(enLabel));
    var enPlural = E.parseActionBarLabel("2 replies, 1 retweet, 1 like, 12 views");
    check("English singular and legacy 'retweet' both map",
      enPlural.replies === 2 && enPlural.retweets === 1 && enPlural.likes === 1 && enPlural.views === 12,
      JSON.stringify(enPlural));
    var enAbbrev = E.parseActionBarLabel("1.2K replies, 3.4M likes, 12 views");
    check("abbreviated counts inside a label", enAbbrev.replies === 1200 && enAbbrev.likes === 3400000,
      JSON.stringify(enAbbrev));
    check("null label -> empty counts", Object.keys(E.parseActionBarLabel(null)).length === 0);
    check("unknown-locale label -> empty counts, no crash",
      Object.keys(E.parseActionBarLabel("3 zorbles, 5 blorps")).length === 0);
    check("first value wins on a duplicated word",
      E.parseActionBarLabel("3 likes, 9 likes").likes === 3);

    // Locale labels, each word transcribed from X's own i18n bundles
    // (abs.twimg.com/responsive-web/client-web/i18n/*, fetched 2026-08-25).
    var esLabel = E.parseActionBarLabel("5 respuestas, 3 reposts, 12 Me gusta, 2 elementos guardados, 900 reproducciones");
    check("Spanish label parses all five counts",
      esLabel.replies === 5 && esLabel.retweets === 3 && esLabel.likes === 12 &&
      esLabel.bookmarks === 2 && esLabel.views === 900, JSON.stringify(esLabel));
    var jaLabel = E.parseActionBarLabel("3件の返信、5件のリポスト、30件のいいね、2件のブックマーク、1034件の表示");
    check("Japanese label parses (no spaces, 、separator, 件の counters)",
      jaLabel.replies === 3 && jaLabel.retweets === 5 && jaLabel.likes === 30 &&
      jaLabel.bookmarks === 2 && jaLabel.views === 1034, JSON.stringify(jaLabel));
    var deLabel = E.parseActionBarLabel("2 Antworten, 1 Repost, 5 „Gefällt mir“-Angaben, 1 Lesezeichen, 984 Mal angezeigt");
    check("German label parses (typographic quotes in the likes word)",
      deLabel.replies === 2 && deLabel.retweets === 1 && deLabel.likes === 5 &&
      deLabel.bookmarks === 1 && deLabel.views === 984, JSON.stringify(deLabel));
    var trLabel = E.parseActionBarLabel("5 yanıt, 3 yeniden gönderi, 50 beğeni, 2 yer işareti, 9000 görüntülenme");
    check("Turkish label parses (multi-word metric names)",
      trLabel.replies === 5 && trLabel.retweets === 3 && trLabel.likes === 50 &&
      trLabel.bookmarks === 2 && trLabel.views === 9000, JSON.stringify(trLabel));
    var hiLabel = E.parseActionBarLabel("4 जवाब, 2 रीपोस्ट, 7 पसंद, 1 बुकमार्क, 500 व्यू");
    check("Hindi label parses",
      hiLabel.replies === 4 && hiLabel.retweets === 2 && hiLabel.likes === 7 &&
      hiLabel.bookmarks === 1 && hiLabel.views === 500, JSON.stringify(hiLabel));
    var ruLabel = E.parseActionBarLabel("5 ответов, 2 репоста, 10 отметок «Нравится», 1 закладка, 700 просмотров");
    check("Russian label parses (case endings via stems)",
      ruLabel.replies === 5 && ruLabel.retweets === 2 && ruLabel.likes === 10 &&
      ruLabel.bookmarks === 1 && ruLabel.views === 700, JSON.stringify(ruLabel));
    var arLabel = E.parseActionBarLabel("5 ردود، 3 إعادات نشر، 10 إعجابات، 2 علامتان مرجعيتان، 900 مشاهدة");
    check("Arabic label parses",
      arLabel.replies === 5 && arLabel.retweets === 3 && arLabel.likes === 10 &&
      arLabel.bookmarks === 2 && arLabel.views === 900, JSON.stringify(arLabel));
    var zhLabel = E.parseActionBarLabel("3 回复, 5 次转帖, 30 喜欢, 2 书签, 1034 次观看");
    check("Chinese (simplified) label parses",
      zhLabel.replies === 3 && zhLabel.retweets === 5 && zhLabel.likes === 30 &&
      zhLabel.bookmarks === 2 && zhLabel.views === 1034, JSON.stringify(zhLabel));
    var partial = E.parseActionBarLabel("31 replies, 253 reposts, 2365 likes");
    check("zero-count metrics omitted from the label stay absent",
      partial.replies === 31 && partial.retweets === 253 && partial.likes === 2365 &&
      partial.bookmarks === undefined && partial.views === undefined, JSON.stringify(partial));

    // ================================================================
    // Reply-marker detection — the string content.js matches to decide a
    // post is a reply. English baseline; localized strings join with sources.
    // ================================================================
    section("Reply-marker detection");
    check("English 'Replying to' detected", E.replyMarkerIn("Replying to @someone") === true);
    check("case-insensitive", E.replyMarkerIn("replying to @someone") === true);
    check("plain text is not a reply marker", E.replyMarkerIn("I like replying to people") === false,
      "prefix locales must anchor to line start, not substring");
    check("empty/null text -> false", E.replyMarkerIn("") === false && E.replyMarkerIn(null) === false);
    // Localized markers, from X's own i18n bundles (2026-08-25). tr/hi/ko put
    // the phrase AFTER the mentions, so those match as contains, not prefix.
    check("Spanish prefix", E.replyMarkerIn("Respondiendo a @user") === true);
    check("Spanish alternate prefix", E.replyMarkerIn("En respuesta a @user") === true);
    check("Portuguese prefix", E.replyMarkerIn("Em resposta a @user") === true);
    check("French prefix", E.replyMarkerIn("En réponse à @user") === true);
    check("German prefix", E.replyMarkerIn("Antwort an @user") === true);
    check("Turkish suffix form", E.replyMarkerIn("@birisi adlı kullanıcıya yanıt olarak") === true);
    check("Hindi suffix form", E.replyMarkerIn("@user को जवाब दे रहे हैं") === true);
    check("Japanese prefix with colon", E.replyMarkerIn("返信先: @userさん") === true);
    check("Korean suffix form", E.replyMarkerIn("@user 님에게 보내는 답글") === true);
    check("Arabic with fathatan diacritic", E.replyMarkerIn("ردًا على @user") === true,
      "must match after stripping U+064B");
    check("Russian prefix", E.replyMarkerIn("В ответ @user") === true);
    check("Chinese prefix", E.replyMarkerIn("回复 @user") === true);
    check("Traditional Chinese prefix", E.replyMarkerIn("回覆給 @user") === true);
    check("Indonesian prefix", E.replyMarkerIn("Membalas @user") === true);

    // ================================================================
    // Engagement-bait detection, Hinglish. Patterns supplied by a native
    // speaker (2026-08-25) rather than transliterated by us. Scope is
    // deliberately the IMPERATIVE CTA family — "do X if you Y" — which is
    // what the English list already targets.
    // ================================================================
    section("Hinglish engagement bait");
    function isBaitText(t) { return E.analyzeText(t).isBait; }

    check("comment karo agar ... -> bait",
      isBaitText("Comment karo agar tum bhi single ho") === true);
    check("1 likho agar ... -> bait",
      isBaitText("1 likho agar tumhe bhi yeh feel hua hai") === true);
    check("like karo agar / follow karo -> bait",
      isBaitText("Like karo agar aap agree karte ho! Follow karo daily tips ke liye!") === true);
    check("sach batao confession demand -> bait",
      isBaitText("Sach batao, tumne bhi kabhi socha hai?") === true);
    check("change my mind -> bait",
      isBaitText("Ladkiyan sirf paisa dekhti hain, change my mind") === true);
    check("tag karo -> bait", isBaitText("Tag karo apne best friend ko") === true);
    check("English bait still detected",
      isBaitText("Like if you agree! Follow me for more!") === true);

    // FALSE-POSITIVE GUARDS. These are ordinary Hinglish posts and one of
    // iGreenGod's real top-quartile posts; flagging any of them would tell a
    // creator their best work is spam.
    check("ordinary Hinglish story is not bait",
      isBaitText("Aaj subah beti ko school chhoda, raaste mein usne pucha badal kahan jaate hain.") === false);
    check("ordinary Devanagari post is not bait",
      isBaitText("आज सुबह मैंने अपनी बेटी को स्कूल छोड़ा और रास्ते में उसने मुझसे पूछा।") === false);
    check("a real top-quartile post is not bait",
      isBaitText("The most dangerous sentence in the house: “Do you know why I’m upset?”") === false,
      "7.6% like rate — his own data");
    check("a genuine question is not bait",
      isBaitText("What single habit most improved your life this year?") === false);

    // Boundary behavior. \b cannot be used here — it is defined by
    // \w = [A-Za-z0-9_], so a Devanagari pattern anchored with \b never
    // matches anything. These lock in the script-neutral edges that replaced
    // it: still no matching inside a longer word, which is all \b was for.
    check("bait phrase inside a longer word is not matched",
      isBaitText("unlike iffy things") === false &&
      isBaitText("I dislike ifs and buts") === false);
    check("bait phrase at the very start of a post is matched",
      isBaitText("Comment karo agar tum bhi single ho") === true);
    check("bait phrase after punctuation is matched",
      isBaitText("Bas ek baat — sach batao, tum khush ho?") === true);
    check("bait phrase at the very end of a post is matched",
      isBaitText("Agar tum bhi thak chuke ho toh comment karo") === true);

    // DELIBERATELY NOT DETECTED. The rhetorical-question / forced-binary
    // "rage bait" genre is real, but it cannot be separated from a sincere
    // question by pattern alone, and the structural rule proposed for it
    // (short + question + absolutist word) was tested against 228 real posts:
    // it fired on 1, and that 1 was a top-quartile post, while missing both
    // canonical bait examples outright. Detecting it would cost more than it
    // buys, so this tool says nothing rather than guessing.
    check("rhetorical-question bait is NOT claimed as detected",
      isBaitText("Kya sach mein pyaar jaisi koi cheez hoti hai?") === false,
      "documented non-goal, not an oversight");
    check("forced binary is NOT claimed as detected",
      isBaitText("Ladka smart hona chahiye ya rich?") === false);

    // ================================================================
    // Reply verdict — which surface you are on decides which signal is
    // trustworthy. Found in the field on 2026-08-25: X renders NO "Replying
    // to" label inside a conversation, so a label-only reader scores every
    // reply under a post as an original. The same is true of /with_replies,
    // which the collector already knew and the extension did not.
    // ================================================================
    section("Reply verdict by surface");
    var V = E.replyVerdict;

    // A repost is never a reply, whatever else is true.
    check("repost is never a reply",
      V({ surface: "conversation", isRepost: true, hasMarker: true, hasArticleAbove: true }).isReply === false);

    // The label is authoritative wherever it appears.
    check("label wins on the timeline",
      V({ surface: "timeline", hasMarker: true }).isReply === true &&
      V({ surface: "timeline", hasMarker: true }).signal === "label");
    check("label wins in a conversation",
      V({ surface: "conversation", hasMarker: true, hasArticleAbove: false }).isReply === true);

    // CONVERSATION: the post above IS the marker. First article is the top of
    // the thread; everything below it replies to something.
    check("conversation: first article is an original",
      V({ surface: "conversation", hasArticleAbove: false }).isReply === false);
    check("conversation: any article below the first is a reply",
      V({ surface: "conversation", hasArticleAbove: true }).isReply === true &&
      V({ surface: "conversation", hasArticleAbove: true }).signal === "thread-position");
    // A focal post with ancestors above it IS itself a reply — same rule.
    check("conversation: focal post with ancestors above is a reply",
      V({ surface: "conversation", hasArticleAbove: true, isFocal: true }).isReply === true);
    // "Discover more" recommendations sit below the thread and are NOT replies.
    check("conversation: recommendations past the boundary are not replies",
      V({ surface: "conversation", hasArticleAbove: true, beyondThread: true }).isReply === false);

    // WITH_REPLIES: conversation pairs, so a different author directly above
    // is the signal (this is what collect.js already does).
    check("with_replies: different author above -> reply",
      V({ surface: "with_replies", hasPrevArticle: true, prevAuthorDiffers: true }).isReply === true &&
      V({ surface: "with_replies", hasPrevArticle: true, prevAuthorDiffers: true }).signal === "parent");
    check("with_replies: same author above -> not a reply",
      V({ surface: "with_replies", hasPrevArticle: true, prevAuthorDiffers: false }).isReply === false);
    check("with_replies: nothing above -> falls back to the label",
      V({ surface: "with_replies", hasPrevArticle: false }).isReply === false);

    // THE REGRESSION GUARD. On the home timeline every neighbour is a
    // different author. If adjacency ever fires here, every post in the feed
    // silently takes the x0.75 reply discount.
    check("timeline: adjacency is IGNORED (guards against flagging the whole feed)",
      V({ surface: "timeline", hasArticleAbove: true, hasPrevArticle: true, prevAuthorDiffers: true }).isReply === false,
      "a different author above is normal on a timeline and means nothing");
    check("timeline: no marker -> not a reply",
      V({ surface: "timeline", hasMarker: false }).isReply === false &&
      V({ surface: "timeline", hasMarker: false }).signal === "none");

    // Surface classification from the URL path.
    check("surface: /user/status/123 -> conversation",
      E.surfaceFromPath("/hridoyreh/status/2092152773148328214") === "conversation");
    check("surface: /user/with_replies -> with_replies",
      E.surfaceFromPath("/iGreenGod/with_replies") === "with_replies");
    check("surface: profile -> timeline", E.surfaceFromPath("/iGreenGod") === "timeline");
    check("surface: home -> timeline", E.surfaceFromPath("/home") === "timeline");
    check("surface: search -> timeline", E.surfaceFromPath("/search") === "timeline");
    check("surface: photo view of a post is still a conversation",
      E.surfaceFromPath("/hridoyreh/status/2092152773148328214/photo/1") === "conversation");

    // ================================================================
    // Reply drafts — the compose meter used to hardcode isReply:false, so a
    // reply draft was scored as an original and never saw the x0.75 discount.
    // ================================================================
    section("Reply drafts");
    var draftBase = { text: "This is a considered reply with enough substance to hold attention for a while.", hasVideo: false, hasImage: false, hasExternalLink: false, hashtagCount: 0 };
    var draftOriginal = E.contentScore(Object.assign({}, draftBase, { isReply: false }), {});
    var draftReply = E.contentScore(Object.assign({}, draftBase, { isReply: true }), {});
    check("reply draft takes the x0.75 discount once",
      approx(draftReply.raw, draftOriginal.raw * 0.75, 1e-12),
      draftReply.raw + " vs " + (draftOriginal.raw * 0.75));

    // ================================================================
    // Score history helpers — pure list/entry logic; storage stays thin.
    // History is local-only (chrome.storage.local) and holds a capped ring
    // buffer of panel-opened scores.
    // ================================================================
    section("Score history helpers");
    var hFeatures = { tweetId: "123", text: "A test post\nwith a newline and quite a lot of text that should get truncated because snippets are capped at eighty characters total", isReply: false, counts: { views: 5000 } };
    var hResult = { content: { score: 61 }, engagement: { available: true, score: 47 } };
    var entry = E.makeHistoryEntry(hFeatures, hResult, 1756100000000);
    check("history entry carries id, time and both scores",
      entry.id === "123" && entry.t === 1756100000000 && entry.c === 61 && entry.e === 47,
      JSON.stringify(entry));
    check("snippet capped at 80 chars, newlines flattened",
      entry.s.length <= 80 && entry.s.indexOf("\n") === -1, JSON.stringify(entry.s));
    var noEng = E.makeHistoryEntry(hFeatures, { content: { score: 61 }, engagement: { available: false } }, 1);
    check("unavailable engagement stored as null", noEng.e === null);

    var hl = [];
    hl = E.pushHistory(hl, { id: "1", t: 1, c: 10, e: null, s: "one" }, 3);
    hl = E.pushHistory(hl, { id: "2", t: 2, c: 20, e: null, s: "two" }, 3);
    hl = E.pushHistory(hl, { id: "3", t: 3, c: 30, e: null, s: "three" }, 3);
    check("newest entry first", hl[0].id === "3" && hl.length === 3, JSON.stringify(hl.map(function (x) { return x.id; })));
    hl = E.pushHistory(hl, { id: "2", t: 4, c: 25, e: null, s: "two again" }, 3);
    check("re-scoring a tweet updates in place, no duplicate",
      hl.length === 3 && hl[0].id === "2" && hl[0].c === 25 &&
      hl.filter(function (x) { return x.id === "2"; }).length === 1,
      JSON.stringify(hl.map(function (x) { return x.id; })));
    hl = E.pushHistory(hl, { id: "4", t: 5, c: 40, e: null, s: "four" }, 3);
    check("cap evicts the oldest", hl.length === 3 && hl.every(function (x) { return x.id !== "1"; }),
      JSON.stringify(hl.map(function (x) { return x.id; })));
    var hlNoId = E.pushHistory([], { id: null, t: 1, c: 10, e: null, s: "x" }, 3);
    hlNoId = E.pushHistory(hlNoId, { id: null, t: 2, c: 20, e: null, s: "y" }, 3);
    check("entries without an id never dedupe", hlNoId.length === 2);

    // ================================================================
    // Under the Hood report parsing — a user-imported JSON file. Hostile
    // input by definition: the parser must validate shape, whitelist label
    // characters, cap sizes, and never throw.
    // ================================================================
    section("Under the Hood report parsing");
    // Shapes match the PUBLISHED serving code (underTheHoodReport.User.strato):
    // percentages arrive as strings with a % sign, account labels carry day
    // counts. A numeric percentage is accepted too.
    var uthGood = JSON.stringify({
      postCount: 42, generatedAt: 1756000000,
      period: { startDate: "2026-07-01", endDate: "2026-07-31", timezone: "UTC" },
      postLabels: [
        { label: "SPAM_HIGH_RECALL", about: "Suspected spam.", effect: "Post hidden from recommendations to non-followers", posts: 3, totalPostsInMonth: 42, percentageOfPosts: "7.14%" }
      ],
      accountLabels: [
        { label: "DoNotAmplify", about: "Account deamplified.", effect: "The account's posts are hidden from recommendations to non-followers", days: 5, daysInPeriod: 31, percentageOfDays: "16.13%" }
      ],
      notes: "ignored free text"
    });
    var uth = E.parseUnderTheHoodReport(uthGood);
    check("valid report parses with counts and period",
      uth && uth.postCount === 42 && uth.period.startDate === "2026-07-01" &&
      uth.postLabels.length === 1 && uth.accountLabels.length === 1,
      JSON.stringify(uth));
    check("string percentage ('7.14%', the published shape) normalizes to a number",
      uth.postLabels[0].label === "SPAM_HIGH_RECALL" &&
      uth.postLabels[0].posts === 3 && uth.postLabels[0].percentageOfPosts === 7.14 &&
      /non-followers/.test(uth.postLabels[0].effect));
    check("account-label day counts survive",
      uth.accountLabels[0].days === 5 && uth.accountLabels[0].daysInPeriod === 31 &&
      uth.accountLabels[0].percentageOfDays === 16.13);
    check("numeric percentage accepted too",
      E.parseUnderTheHoodReport('{"postLabels":[{"label":"SPAM","posts":1,"percentageOfPosts":7.1}]}')
        .postLabels[0].percentageOfPosts === 7.1);
    check("garbage JSON -> null", E.parseUnderTheHoodReport("not json {") === null);
    check("JSON array -> null", E.parseUnderTheHoodReport("[1,2,3]") === null);
    check("object with neither label family -> null",
      E.parseUnderTheHoodReport('{"foo": 1}') === null);
    var uthHostile = JSON.stringify({
      postLabels: [
        { label: "<img src=x onerror=alert(1)>", posts: 1 },
        { label: "OK_LABEL", posts: "not-a-number", effect: 12345 },
        "not an object", null
      ]
    });
    var hostile = E.parseUnderTheHoodReport(uthHostile);
    check("hostile label name rejected, malformed rows dropped",
      hostile !== null && hostile.postLabels.length === 1 &&
      hostile.postLabels[0].label === "OK_LABEL", JSON.stringify(hostile));
    check("non-numeric posts and non-string effect become null",
      hostile.postLabels[0].posts === null && hostile.postLabels[0].effect === null);
    var longStr = new Array(3000).join("x");
    var uthLong = E.parseUnderTheHoodReport(JSON.stringify({
      postLabels: [{ label: "SPAM", about: longStr, effect: longStr, posts: 1 }]
    }));
    check("oversize strings truncated",
      uthLong.postLabels[0].about.length <= 400 && uthLong.postLabels[0].effect.length <= 400);

    // ================================================================
    section("Composite");
    var full = E.scoreTweet({ text: "Hello", counts: { likes: 10, retweets: 1, replies: 2, views: 5000 }, hasVideo: false, hasImage: false, hasExternalLink: false, hashtagCount: 0, isReply: false, ageMinutes: 100 }, {});
    check("scoreTweet returns content+engagement+age", full.content.available && full.engagement.available && full.ageDecay !== null);

    var sum = document.createElement("h1");
    sum.textContent = passed + " passed, " + failed + " failed";
    sum.className = failed ? "fail" : "pass";
    out.appendChild(sum);
    document.title = (failed ? "FAIL " : "PASS ") + document.title;
  </script>
</body>
</html>
